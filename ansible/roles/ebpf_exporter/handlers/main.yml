---
- name: Restart ebpf-tcp-exporter
  ansible.builtin.systemd:
    daemon_reload: true
    name: ebpf-tcp-exporter
    state: restarted
  become: true

- name: Restart ebpf-execsnoop
  ansible.builtin.systemd:
    daemon_reload: true
    name: ebpf-execsnoop
    state: restarted
  become: true

- name: Restart ebpf-opensnoop
  ansible.builtin.systemd:
    daemon_reload: true
    name: ebpf-opensnoop
    state: restarted
  become: true

- name: Restart ebpf-killsnoop
  ansible.builtin.systemd:
    daemon_reload: true
    name: ebpf-killsnoop
    state: restarted
  become: true

- name: Restart ebpf-syncsnoop
  ansible.builtin.systemd:
    daemon_reload: true
    name: ebpf-syncsnoop
    state: restarted
  become: true

- name: Copy capable bpftrace script
  ansible.builtin.copy:
    src: capable.bt
    dest: /opt/ebpf-snoop-tools/capable.bt
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: restart ebpf-capable

- name: Install capable systemd unit
  ansible.builtin.copy:
    src: ebpf-capable.service
    dest: /etc/systemd/system/ebpf-capable.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart ebpf-capable

- name: Ensure capable is enabled and running
  ansible.builtin.systemd:
    name: ebpf-capable
    enabled: true
    state: started
    daemon_reload: true
  become: true
