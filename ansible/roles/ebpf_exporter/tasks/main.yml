  become: true
  notify: restart ebpf-killsnoop

- name: Install killsnoop systemd unit
  ansible.builtin.copy:
    src: ebpf-killsnoop.service
    dest: /etc/systemd/system/ebpf-killsnoop.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart ebpf-killsnoop

- name: Ensure killsnoop is enabled and running
  ansible.builtin.systemd:
    name: ebpf-killsnoop
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Copy syncsnoop bpftrace script
  ansible.builtin.copy:
    src: syncsnoop.bt
    dest: /opt/ebpf-snoop-tools/syncsnoop.bt
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: restart ebpf-syncsnoop

- name: Install syncsnoop systemd unit
  ansible.builtin.copy:
    src: ebpf-syncsnoop.service
    dest: /etc/systemd/system/ebpf-syncsnoop.service
    owner: root
    group: root
