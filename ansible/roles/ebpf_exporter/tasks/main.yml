    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart ebpf-opensnoop

- name: Ensure opensnoop is enabled and running
  ansible.builtin.systemd:
    name: ebpf-opensnoop
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Copy killsnoop bpftrace script
  ansible.builtin.copy:
    src: killsnoop.bt
    dest: /opt/ebpf-snoop-tools/killsnoop.bt
    owner: root
    group: root
