---
# ansible/roles/ebpf_tcp_exporter/tasks/main.yml
#
# Note: beyla_demo's role already installs bpftrace + linux-headers as part
# of its "Install eBPF tracing tools" task, so this is technically
# redundant if that role runs first in the same play -- but kept here so
# this role stays self-contained and can be applied to a host on its own.

- name: Install bpftrace and pip
  ansible.builtin.apt:
    name:
      - bpftrace
      - python3-pip
    state: present
    update_cache: true
  become: true

- name: Install prometheus_client for the exporter
  ansible.builtin.pip:
    name: prometheus_client
    executable: pip3
  become: true

- name: Create exporter directory
  ansible.builtin.file:
    path: /opt/ebpf-tcp-observability
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Copy exporter files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/ebpf-tcp-observability/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - tcp_trace.bt
    - exporter.py
  become: true
  notify: restart ebpf-tcp-exporter

- name: Install systemd unit
  ansible.builtin.copy:
    src: ebpf-tcp-exporter.service
    dest: /etc/systemd/system/ebpf-tcp-exporter.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart ebpf-tcp-exporter

- name: Ensure exporter is enabled and running
  ansible.builtin.systemd:
    name: ebpf-tcp-exporter
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Create log directory for eBPF snoop tools
  ansible.builtin.file:
    path: /var/log/ebpf
    state: directory
    mode: "0755"
  become: true

- name: Create execsnoop directory
  ansible.builtin.file:
    path: /opt/ebpf-snoop-tools
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Copy execsnoop bpftrace script
  ansible.builtin.copy:
    src: execsnoop.bt
    dest: /opt/ebpf-snoop-tools/execsnoop.bt
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: restart ebpf-execsnoop

- name: Install execsnoop systemd unit
  ansible.builtin.copy:
    src: ebpf-execsnoop.service
    dest: /etc/systemd/system/ebpf-execsnoop.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart ebpf-execsnoop

- name: Ensure execsnoop is enabled and running
  ansible.builtin.systemd:
    name: ebpf-execsnoop
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Copy opensnoop bpftrace script
  ansible.builtin.copy:
