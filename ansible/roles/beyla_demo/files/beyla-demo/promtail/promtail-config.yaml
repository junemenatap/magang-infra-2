---
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ebpf-execsnoop
    static_configs:
      - targets:
          - localhost
        labels:
          job: ebpf-snoop
          tool: execsnoop
          __path__: /var/log/ebpf/execsnoop.log

  - job_name: ebpf-opensnoop
    static_configs:
      - targets:
          - localhost
        labels:
          job: ebpf-snoop
          tool: opensnoop
          __path__: /var/log/ebpf/opensnoop.log

  - job_name: ebpf-killsnoop
    static_configs:
      - targets:
          - localhost
        labels:
          job: ebpf-snoop
          tool: killsnoop
          __path__: /var/log/ebpf/killsnoop.log

  - job_name: ebpf-syncsnoop
    static_configs:
      - targets: [localhost]
        labels:
          job: ebpf-snoop
          tool: syncsnoop
          __path__: /var/log/ebpf/syncsnoop.log

  - job_name: ebpf-capable
    static_configs:
      - targets: [localhost]
        labels:
          job: ebpf-snoop
          tool: capable
          __path__: /var/log/ebpf/capable.log

  - job_name: systemd-journal
    journal:
      max_age: 12h
      path: /var/log/journal
      labels:
        job: ebpf-snoop-health
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        target_label: "unit"
      - source_labels: ["unit"]
        regex: "ebpf-(execsnoop|opensnoop|killsnoop|syncsnoop|capable)\\.service"
        action: keep
