---
- name: Install prerequisites for Docker's apt repo
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  become: true

- name: Create keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true

- name: Add Docker's apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64'
      else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker
  become: true

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true

- name: Create deployment directory
  ansible.builtin.file:
    path: /opt/beyla-demo
    state: directory
    mode: "0755"
  become: true

- name: Create log dir for eBPF snoopers
  ansible.builtin.file:
    path: /var/log/ebpf
    state: directory
    mode: "0755"
  become: true

- name: Copy Beyla demo project files
  ansible.builtin.copy:
    src: beyla-demo/
    dest: /opt/beyla-demo/
    mode: preserve
  become: true

- name: Build and start the stack
  community.docker.docker_compose_v2:
    project_src: /opt/beyla-demo
    state: present
  become: true

# --- NEW TASK ---
# Everything above this point ran with become:true, so /opt/beyla-demo and
# everything inside it (including anything docker compose created on the
# host side, e.g. bind-mounted config dirs) ends up owned by root. That
# blocks the login user from creating new files/dirs there afterward
# (e.g. mkdir for test-output directories). Hand ownership back so the
# directory is fully writable by the login user after every fresh deploy.
- name: Ensure app directory is owned by the login user, not root
  ansible.builtin.file:
    path: /opt/beyla-demo
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: true
    state: directory
  become: true
# --- END NEW TASK ---

- name: Generate some traffic so Beyla/Prometheus have data
  ansible.builtin.uri:
    url: "http://localhost:8000/order"
    method: GET
    status_code: [200, 500]
  loop: "{{ range(1, 51) | list }}"
  become: true

- name: Install networking utilities
  ansible.builtin.apt:
    name:
      - dnsutils
      - wget
    state: present
    update_cache: true
  become: true

- name: Install eBPF tracing tools
  ansible.builtin.apt:
    name:
      - bpfcc-tools
      - "linux-headers-{{ ansible_kernel }}"
      - bpftool
      - bpftrace
    state: present
  become: true
