name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ansible/roles/beyla_demo/files/beyla-demo/backend-api/requirements.txt
            ansible/roles/beyla_demo/files/beyla-demo/frontend-api/requirements.txt

      - name: Install linters
        run: python -m pip install --disable-pip-version-check ansible-core ansible-lint ruff

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: Lint Python
        run: ruff check ansible

      - name: Lint Ansible
        run: ansible-lint ansible

      - name: Check Python syntax
        run: python -m compileall -q ansible

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive gcp

      - name: Initialize Terraform
        working-directory: gcp
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: gcp
        run: terraform validate -no-color

  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend API image
        uses: docker/build-push-action@v6
        with:
          context: ansible/roles/beyla_demo/files/beyla-demo/backend-api
          push: false

      - name: Build frontend API image
        uses: docker/build-push-action@v6
        with:
          context: ansible/roles/beyla_demo/files/beyla-demo/frontend-api
          push: false
